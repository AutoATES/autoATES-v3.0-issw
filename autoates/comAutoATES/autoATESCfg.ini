; autoATES v3.0 — ISSW 2026 default settings
;
; Typical = [PRA]/frequent and [FlowPy] frequent_alpha 30
; Infrequent = [PRA]/extreme and [FlowPy] extreme_alpha 18
;
; Copy this file, set the three paths in [General]/[Input], keep the rest
; unless you have a local validation set. See README.md.

[General]
project_name = autoATES_v3_issw
working_dir = ./outputs
output_basename = autoATES_v3
target_resolution_x = 0
target_resolution_y = 0
aoi_path = ./aoi.shp

[Input]
dem_path = ./dem.tif
forest_canopy_path = ./forest_canopy.tif

[Processing]
run_pra = True
run_runout = True
run_ates = True
run_colorize = True

[PRA]
run_frequent = True
run_extreme = True
sieve_filter_m2 = 1000
forest_type = sen2cc
enable_ruggedness = False
rugg_a = 0.01
rugg_b = 5
rugg_c = -0.007
wind_direction = 0
wind_tolerance = 180
wind_probability = 0.5
wind_radius_m = 60
wind_radius_cells = 0
wind_a = 3
wind_b = 10
wind_c = 3
frequent_pra_threshold = 0.25
frequent_slope_a = 12
frequent_slope_b = 4
frequent_slope_c = 42.5
frequent_forest_a = 50
frequent_forest_b = 3.0
frequent_forest_c = 0
extreme_pra_threshold = 0.05
extreme_slope_a = 14
extreme_slope_b = 4
extreme_slope_c = 40
extreme_forest_a = 50
extreme_forest_b = 3.0
extreme_forest_c = 0

[PRA_Segmentation]
enable_morphological_cleanup = True
opening_iterations = 1
closing_iterations = 1
downsample_factor = 1
frequent_min_distance = 2
frequent_pra_maxima_min_distance = 2
frequent_pra_scale_factor = 1.0
frequent_merge_threshold = 5000
frequent_max_polygon_size_m2 = 250000
frequent_pra_weight = 5.0
frequent_curvature_weight = 2.5
frequent_aspect_weight = 1.0
frequent_forest_weight = 1.0
frequent_elevation_weight = 1.0
extreme_min_distance = 5
extreme_pra_maxima_min_distance = 5
extreme_pra_scale_factor = 1.0
extreme_merge_threshold = 15000
extreme_max_polygon_size_m2 = 500000
extreme_pra_weight = 5.0
extreme_curvature_weight = 1.0
extreme_aspect_weight = 2.0
extreme_forest_weight = 1.0
extreme_elevation_weight = 2.5
enable_island_cleanup = False
small_threshold = 5
large_ratio = 8

[FlowPy]
engine = numba
exponent = 8.0
flux_threshold = 0.003
max_z = 270.0
output_files = zDelta|cellCounts|travelLengthMax|travelLengthMin|fpTravelAngleMax|fpTravelAngleMin|flux|slTravelAngle|zDeltaSum|routFluxSum|depFluxSum
forest_module = forestDetrainment
max_added_friction = 52.0
min_added_friction = 5.0
vel_th_for_friction = 270.0
max_detrainment = 0.003
min_detrainment = 0.00001
vel_th_for_detrainment = 270.0
f_fr_layer_type = absolute
skip_forest_dist = 0.0
forest_interaction = True
tile_size = 15000
tile_overlap = 6000
frequent_alpha = 30.0
extreme_alpha = 18.0

[ATES]
; dev8 is the workshop classifier (split votes, reach floors, class-0 ceiling).
; legacy runs the PRA-base rules in this block (pra, az, rf, sat, tree, class4_alpha).
model = dev8
base_layer = pra
pra1 = 0.05
pra2 = 0.25
pra3 = 0.6
sat01 = 15
sat12 = 25
sat23 = 32
sat34 = 45
win_size = 5
az1 = 1
az2 = 30
az3 = 75
rf1 = 0
rf2 = 500
rf3 = 3000
flux_cutoff = 25
class4_alpha = 60
tree1 = 20
tree2 = 60
tree3 = 85
; Minimum mapping unit, square metres. These are the dev8 spec.
mmu_class0 = 10000
mmu_class1 = 10000
mmu_class2 = 5000
mmu_class3 = 5000
mmu_class4 = 2500
class0_prox = 25

[Output]
save_tif = True
save_shp = True
save_reports = True
